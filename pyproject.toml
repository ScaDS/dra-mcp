[project]
name = "dra-mcp"
version = "0.1.0"
description = "MCP server that fills out the German business-trip application PDF."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.10",
    "pypdf>=5.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
